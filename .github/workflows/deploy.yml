name: Deploy to Netlify

on:
  push:
    branches:
      - claude/festive-mendel-56mshj
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://foghopmnxjqabcmfhawa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8jR8zR1Vrotyi94VhHyZSg_g8RL9HJu

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=dist --prod --site=${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
